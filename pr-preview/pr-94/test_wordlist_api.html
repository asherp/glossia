<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wordlist API Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .info { color: #dcdcaa; }
        pre { background: #252526; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Wordlist Metadata API Test</h1>
    <pre id="output">Loading WASM...</pre>

    <script type="module">
        import init, {
            get_wordlist_size,
            get_bits_per_word,
            get_languages,
            get_wordlists
        } from './glossia.js';

        const output = document.getElementById('output');

        function log(msg, className = '') {
            const line = document.createElement('div');
            line.textContent = msg;
            if (className) line.className = className;
            output.appendChild(line);
        }

        async function runTests() {
            output.innerHTML = '';
            log('✓ WASM initialized', 'success');
            log('');

            // Test 1: BIP39 wordlist (standard 2048-word list)
            log('Test 1: BIP39 wordlist', 'info');
            const bip39Size = JSON.parse(get_wordlist_size('english', 'bip39'));
            log(`  Size: ${JSON.stringify(bip39Size)}`);

            if (bip39Size.size === 2048) {
                log('  ✓ Correct size (2048)', 'success');
            } else {
                log(`  ✗ Expected 2048, got ${bip39Size.size}`, 'error');
            }

            const bip39Bits = JSON.parse(get_bits_per_word('english', 'bip39'));
            log(`  Bits per word: ${JSON.stringify(bip39Bits)}`);

            if (bip39Bits.bits_per_word === 11) {
                log('  ✓ Correct bits (11 = log₂(2048))', 'success');
            } else {
                log(`  ✗ Expected 11, got ${bip39Bits.bits_per_word}`, 'error');
            }
            log('');

            // Test 2: Test all available languages and wordlists
            log('Test 2: All available wordlists', 'info');
            const languages = JSON.parse(get_languages());
            log(`  Languages: ${languages.join(', ')}`);
            log('');

            for (const lang of languages) {
                const wordlists = JSON.parse(get_wordlists(lang));
                log(`  ${lang}:`, 'info');

                for (const wl of wordlists) {
                    const sizeResult = JSON.parse(get_wordlist_size(lang, wl));
                    const bitsResult = JSON.parse(get_bits_per_word(lang, wl));

                    if (sizeResult.error || bitsResult.error) {
                        log(`    ${wl}: ERROR - ${sizeResult.error || bitsResult.error}`, 'error');
                    } else {
                        const size = sizeResult.size;
                        const bits = bitsResult.bits_per_word;
                        const isPowerOfTwo = (size & (size - 1)) === 0 && size > 0;
                        const expectedBits = Math.log2(size);

                        if (isPowerOfTwo && bits === expectedBits) {
                            log(`    ${wl}: ${size} words, ${bits} bits/word ✓`, 'success');
                        } else {
                            log(`    ${wl}: ${size} words, ${bits} bits/word (power-of-2: ${isPowerOfTwo})`, 'info');
                        }
                    }
                }
                log('');
            }

            // Test 3: Error handling - invalid wordlist
            log('Test 3: Error handling', 'info');
            const invalidSize = JSON.parse(get_wordlist_size('english', 'nonexistent'));
            if (invalidSize.error) {
                log(`  ✓ Correct error for invalid wordlist: "${invalidSize.error}"`, 'success');
            } else {
                log(`  ✗ Should have returned error`, 'error');
            }
            log('');

            log('=== Tests complete ===', 'info');
        }

        init().then(runTests).catch(err => {
            output.innerHTML = `<span class="error">Failed to load WASM: ${err}</span>`;
        });
    </script>
</body>
</html>
