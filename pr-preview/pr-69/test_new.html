<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossia - Test New Detection</title>
<style>
body { font-family: monospace; padding: 2rem; max-width: 800px; margin: 0 auto; }
.success { color: green; }
.error { color: red; }
pre { background: #f0f0f0; padding: 1rem; overflow-x: auto; }
</style>
</head>
<body>
<h1>Glossia WASM Test</h1>
<div id="status">Loading...</div>
<div id="result"></div>

<script type="module">
// Add timestamp to force cache bypass
import init, {
  get_languages,
  detect_dialect_from_text,
} from './glossia.js?v=' + Date.now();

async function test() {
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  try {
    status.innerHTML = '⏳ Initializing WASM...';
    await init();
    status.innerHTML = '<span class="success">✅ WASM initialized</span>';

    // Test get_languages
    const langs = JSON.parse(get_languages());
    result.innerHTML += `<p><strong>Languages:</strong> ${langs.join(', ')}</p>`;

    // Test new detection function
    const testText = "abandon ability able about above absent absorb";
    result.innerHTML += `<p><strong>Test text:</strong> ${testText}</p>`;

    status.innerHTML += '<br>⏳ Testing detect_dialect_from_text...';
    const matches = JSON.parse(detect_dialect_from_text(testText));
    status.innerHTML += '<br><span class="success">✅ Detection works!</span>';

    result.innerHTML += '<p><strong>Detection results:</strong></p><pre>' +
      JSON.stringify(matches, null, 2) + '</pre>';

  } catch (e) {
    status.innerHTML = '<span class="error">❌ Error: ' + e.message + '</span>';
    result.innerHTML = '<pre class="error">' + e.stack + '</pre>';
  }
}

test();
</script>
</body>
</html>
