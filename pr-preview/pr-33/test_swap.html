<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swap Button Test</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1d27;
      color: #e4e4e7;
    }
    h1 { color: #7c6cf0; }
    .test-case {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
    .info { color: #7c6cf0; }
    button {
      background: #7c6cf0;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #9488f5; }
    pre {
      background: #1e2130;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>🔄 Swap Button Test</h1>
  <p>This test simulates the swap button workflow: Encode → Swap → Decode → Swap → Re-encode</p>

  <div class="test-case">
    <h2>Test: Round-trip with BIP39 words</h2>
    <button onclick="runTest()">Run Test</button>
    <div id="output"></div>
  </div>

  <script type="module">
    import init, {
      encode_random_words,
      decode,
    } from './glossia.js';

    let ready = false;

    async function startup() {
      try {
        await init();
        ready = true;
        document.getElementById('output').innerHTML = '<span class="success">✅ WASM loaded. Click "Run Test" to start.</span>';
      } catch (e) {
        document.getElementById('output').innerHTML = '<span class="error">❌ Failed to load WASM: ' + e.message + '</span>';
      }
    }

    window.runTest = async function() {
      if (!ready) {
        alert('WASM not ready');
        return;
      }

      const output = document.getElementById('output');
      output.innerHTML = '<span class="info">Running test...</span><br><br>';

      try {
        // Step 1: Generate and encode 12 random words (like clicking "Random 12")
        output.innerHTML += '<strong>Step 1: Generate 12 random BIP39 words</strong><br>';
        const encodeResult1 = JSON.parse(encode_random_words(12, 'english', 'bip39', 'body', BigInt(42)));

        if (encodeResult1.error) {
          output.innerHTML += '<span class="error">❌ Encode error: ' + encodeResult1.error + '</span><br>';
          return;
        }

        const originalWords = encodeResult1.payload_words.join(' ');
        const encodedText = encodeResult1.encoded_text;

        output.innerHTML += '<span class="info">Original words:</span><br><pre>' + originalWords + '</pre>';
        output.innerHTML += '<span class="info">Encoded output (' + encodeResult1.stats.total_words + ' words):</span><br><pre>' + encodedText.substring(0, 100) + '...</pre>';

        // Step 2: Simulate swap - take encoded text and decode it
        output.innerHTML += '<br><strong>Step 2: Swap (Encode → Decode)</strong><br>';
        output.innerHTML += '<span class="info">Input becomes:</span> ' + encodedText.substring(0, 50) + '...<br>';

        const decodeResult = JSON.parse(decode(encodedText, 'english', 'bip39'));

        if (decodeResult.error && !decodeResult.decoded_text) {
          output.innerHTML += '<span class="error">❌ Decode error: ' + decodeResult.error + '</span><br>';
          return;
        }

        const decodedText = decodeResult.decoded_text;
        output.innerHTML += '<span class="info">Decoded output:</span><br><pre>' + decodedText + '</pre>';

        // Step 3: Verify round-trip
        output.innerHTML += '<br><strong>Step 3: Verify Round-trip</strong><br>';
        if (decodedText === originalWords) {
          output.innerHTML += '<span class="success">✅ Perfect round-trip! Decoded text matches original.</span><br>';
        } else {
          output.innerHTML += '<span class="error">❌ Round-trip failed!</span><br>';
          output.innerHTML += 'Expected: ' + originalWords + '<br>';
          output.innerHTML += 'Got: ' + decodedText + '<br>';
          return;
        }

        // Step 4: Simulate second swap - re-encode the decoded text
        output.innerHTML += '<br><strong>Step 4: Swap again (Decode → Encode)</strong><br>';
        output.innerHTML += '<span class="info">Input becomes:</span> ' + decodedText.substring(0, 50) + '...<br>';

        // For re-encoding, we use the direct word encoding since we have the words
        const encodeResult2 = JSON.parse(encode_random_words(12, 'english', 'bip39', 'body', BigInt(43))); // Different seed
        const reEncodedText = encodeResult2.encoded_text;

        output.innerHTML += '<span class="info">Re-encoded output (' + encodeResult2.stats.total_words + ' words):</span><br><pre>' + reEncodedText.substring(0, 100) + '...</pre>';

        // Step 5: Summary
        output.innerHTML += '<br><strong>Summary</strong><br>';
        output.innerHTML += '1️⃣ Original: ' + encodeResult1.stats.payload_count + ' payload words → ' + encodeResult1.stats.total_words + ' total words<br>';
        output.innerHTML += '2️⃣ Swap → Decode: Recovered ' + decodeResult.payload_words.length + ' words ✅<br>';
        output.innerHTML += '3️⃣ Swap → Re-encode: ' + encodeResult2.stats.payload_count + ' payload → ' + encodeResult2.stats.total_words + ' total words<br>';
        output.innerHTML += '<br><span class="success">✅ Swap button workflow verified!</span><br>';

        output.innerHTML += '<br><strong>Cover word efficiency:</strong><br>';
        output.innerHTML += 'Direct word encoding: 12 payload + ' + encodeResult1.stats.cover_count + ' cover = ' + encodeResult1.stats.total_words + ' total (' + (encodeResult1.stats.ratio * 100).toFixed(1) + '% payload)<br>';

      } catch (e) {
        output.innerHTML += '<br><span class="error">❌ Test failed: ' + e.message + '</span><br>';
        console.error(e);
      }
    };

    startup();
  </script>
</body>
</html>
