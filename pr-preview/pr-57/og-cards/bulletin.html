<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'DejaVu Sans', system-ui, sans-serif;
    background: #d7d5cf;
    color: #26241d;
    position: relative;
    overflow: hidden;
    padding: 52px 60px;
  }
  .card {
    height: 100%;
    background: #f6f3ec;
    border: 1px solid #d8d2c4;
    border-radius: 4px;
    box-shadow: 0 30px 70px -34px rgba(20,18,14,.55);
    padding: 52px 60px 46px;
    display: flex;
    flex-direction: column;
  }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #26241d; padding-bottom: 16px; }
  .brand { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: .22em; text-transform: uppercase; }
  .issue { font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: #a29c88; }

  .meta { display: flex; gap: 20px; margin-top: 34px; font-family: 'DejaVu Sans Mono', monospace; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #a29c88; }
  .meta .subject { color: #9a5b3f; }

  .prose { margin-top: 20px; font-family: 'DejaVu Serif', Georgia, serif; font-style: italic; font-size: 37px; line-height: 1.5; color: #413d33; max-width: 980px; }
  .prose .pw { font-style: normal; font-weight: 700; color: #26241d; }
  .attr { margin-top: 20px; text-align: right; font-family: 'DejaVu Serif', Georgia, serif; font-style: italic; font-size: 23px; color: #84806f; }

  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; padding-top: 26px; border-top: 1px solid #e2ddce; font-family: 'DejaVu Sans Mono', monospace; font-size: 18px; color: #84806f; }
  .foot .lock { color: #9a5b3f; }
  .foot .url { color: #9a5b3f; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="card">
    <div class="masthead">
      <span class="brand">Glossia Bulletin</span>
      <span class="issue">Encrypted · on nostr</span>
    </div>

    <div class="meta">
      <span>04 Jul 2026</span>
      <span class="subject">Dispatch</span>
    </div>

    <p class="prose">The <span class="pw">auburn</span> envoy will <span class="pw">travel</span> north before the <span class="pw">harvest</span>, and the <span class="pw">quiet</span> ledger keeps its <span class="pw">counsel</span> until the frost.</p>
    <div class="attr">— an encrypted bulletin, read with a key</div>

    <div class="foot">
      <span><span class="lock">🔒</span>&nbsp; A readable encoding — not steganography</span>
      <span class="url">glossia.io/bulletin.html</span>
    </div>
  </div>
</body>
</html>
