# MIDI Note Payload Wordlist for Glossia (music language)
#
# All 128 MIDI note values (0-127) as note-name tokens.
# Scientific pitch notation: C-1 (MIDI 0) through G9 (MIDI 127).
#
# 128 symbols = 2^7 → 7 bits per note
#
# Each token is a single MIDI note event (pitch). Duration, velocity,
# and timing are provided by cover tokens and grammar structure.
#
# Octave convention: MIDI 60 = C4 (middle C)
#   MIDI 0   = C-1
#   MIDI 21  = A0  (lowest piano key)
#   MIDI 60  = C4  (middle C)
#   MIDI 108 = C8  (highest piano key)
#   MIDI 127 = G9

