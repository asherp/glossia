# Palette Color Payload Wordlist for Glossia (images language)
#
# 64 palette positions along a parametric curve in CIELAB color space.
# Each token names a color at an equally-spaced arc-length position on
# the palette curve defined in palette.yaml.
#
# 64 symbols = 2^6 -> 6 bits per palette color
#
# Each token is a single color sample. The actual CIELAB coordinates
# are computed at encode time from the palette curve:
#
#   c_i = gamma( i * L / (N-1) ),  i = 0, ..., 63
#
# where L is the curve's total arc length and gamma is the spline.
#
# Additional bits per pixel come from the constellation grid (normal-
# plane displacement), handled by the rendering layer — not the grammar.
#
# Default palette: viridis_approx (dark violet -> teal -> yellow-green)
# Other palettes (warm, cool) are selected via dialect configuration.
#
# Naming: "c" prefix + 2-digit index (analogous to MIDI note names).
# The index IS the palette position; the color it maps to depends on
# which palette curve is active.

# -- Palette positions 0-9 (dark violet / deep blue region) -----------

