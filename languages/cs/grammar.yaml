# CS Grammar — ASCII-Armored Character-Level Messages & Signatures
#
# Structural grammar for encoding character-level payloads inside ASCII armor.
# The grammar wraps a variable-length run of characters (N slots)
# with deterministic header/footer framing (cover-word slots).
#
# Output structure (encrypted message dialects):
#   ----- BEGIN <PROTOCOL> ENCRYPTED MESSAGE -----
#   <payload characters>
#   ----- END <PROTOCOL> ENCRYPTED MESSAGE -----
#
# Output structure (plain message dialects):
#   ----- BEGIN MESSAGE -----
#   <payload characters>
#   ----- END MESSAGE -----
#
# Output structure (signature dialects):
#   ----- BEGIN [<PROTOCOL>] SIGNATURE -----
#   <payload characters>
#   ----- END [<PROTOCOL>] SIGNATURE -----
#
# Dialects select the protocol identifier and payload alphabet:
#   raw      → no armor, payload only
#   nip04    → NIP-04  (base64, encrypted message armor)
#   nip44    → NIP-44  (base64, encrypted message armor)
#   pgp      → PGP     (base58, encrypted message armor)
#   ascii7   → plain   (printable ASCII, 95 chars, plain message armor)
#   sig        → plain   (base58, plain signature armor)
#   sig_pgp    → PGP     (base58, PGP signature armor)
#   sig_nostr  → NOSTR   (base16, Nostr Schnorr signature armor)
#   seal_nostr → NOSTR   (npub, Nostr seal armor for bech32 pubkeys)
#   email      → simple text/plain email with envelope headers
#   email_alt  → multipart/alternative (text + html)
#   email_mime → multipart/mixed with attachment
#   email_raw  → content only, no email structure
#
# Type inventory:
#   e = entity (payload character)
#   t = truth value (complete message / structural unit)

grammar:
  name: "CS Grammar"
  codec: base_n

  # Payload grammar: how payload words are formatted in the output.
  # "" = concatenate without spaces (base58 characters form a single string).
  # The decoder must split character-by-character to extract payload.
  payload_separator: ""

  # Dot POS produces structural tokens ("-----"), not sentence-ending periods.
  dot_is_punctuation: false

  # Wrap payload body at 76 characters per line (standard ASCII armor width).
  payload_line_width: 76

  types:
    - name: "N"
      lambda_type: "e -> t"

    - name: "Dot"
      lambda_type: "t"

    - name: "Aux"
      lambda_type: "(e -> t) -> (e -> t)"

    - name: "Prefix"
      lambda_type: "t -> t"

    - name: "Cop"
      lambda_type: "(e -> t) -> (e -> t)"

    - name: "To"
      lambda_type: "(e -> t) -> (e -> t)"

    - name: "Modal"
      lambda_type: "(e -> t) -> (e -> t)"

    - name: "Conj"
      lambda_type: "t -> (t -> t)"

  # Base rules (body dialect)
  #
  # sentence → HEADER BODY FOOTER
  # HEADER   → Dot Aux[begin] Prefix Cop To Dot Conj
  # BODY     → N | N BODY  (recursive: variable-length payload)
  # FOOTER   → Conj Dot Aux[end] Prefix Cop To Dot
  #
  # Conj = newline ("\n") — separates armor header/footer from payload body.
  rules:
    sentence:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "HEADER BODY FOOTER"
          weight: 1.0
          lambda: "λn:(e->t). n"

    HEADER:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "Dot Aux[begin] Prefix Cop To Dot Conj"
          weight: 1.0
          lambda: "λn:(e->t). n"

    BODY:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "N"
          weight: 0.1
          lambda: "λn:(e->t). n"
        - production: "N BODY"
          weight: 0.9
          lambda: "λn:(e->t). n"

    FOOTER:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "Conj Dot Aux[end] Prefix Cop To Dot"
          weight: 1.0
          lambda: "λn:(e->t). n"

  # Dialect overrides
  #
  # Each dialect pins the Prefix refinement in the header/footer
  # so the generator deterministically selects the correct protocol tag.
  #
  # Each dialect may also specify:
  #   payload_wordlist: which payload file to use ("default" -> payload.yaml, "base58" -> payload_base58.yaml)
  #   cover_wordlist:   which cover file to use ("default" -> cover.yaml)
  #   payload_line_width: override line wrapping (null = no wrapping)
  dialects:
    raw:
      # Raw payload characters only — no ASCII armor, no line wrapping.
      # Used for compact representations where only the encoded data is needed.
      payload_line_width: null
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"

    nip04:
      payload_wordlist: "base64"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nip04] Cop To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nip04] Cop To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    nip44:
      payload_wordlist: "base64"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nip44] Cop To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nip44] Cop To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    nip04_bip39:
      # NIP-04 encrypted message armor with BIP39 mnemonic words as payload.
      # Output: ----- BEGIN NIP-04 ENCRYPTED MESSAGE -----\n<bip39 words>\n----- END NIP-04 ENCRYPTED MESSAGE -----
      payload_wordlist: "bip39"
      payload_language: "english"
      payload_separator: " "
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nip04] Cop To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"
        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nip04] Cop To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    nip44_bip39:
      # NIP-44 encrypted message armor with BIP39 mnemonic words as payload.
      # Output: ----- BEGIN NIP-44 ENCRYPTED MESSAGE -----\n<bip39 words>\n----- END NIP-44 ENCRYPTED MESSAGE -----
      payload_wordlist: "bip39"
      payload_language: "english"
      payload_separator: " "
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nip44] Cop To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"
        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nip44] Cop To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    pgp:
      payload_wordlist: "base58"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[pgp] Cop To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[pgp] Cop To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    ascii7:
      # Plain ASCII armor — no protocol tag, no "ENCRYPTED".
      # Output: ----- BEGIN MESSAGE -----\n<payload>\n----- END MESSAGE -----
      payload_wordlist: "ascii7"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] To Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] To Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    # ── Signature dialects ─────────────────────────────────────────
    #
    # Cryptographic signature armor.  Structurally similar to message
    # armor but uses SIGNATURE (Modal[sig]) instead of
    # ENCRYPTED MESSAGE (Cop + To), making the header one token shorter.
    #
    # HEADER tokens:
    #   Message (encrypted):  Dot Aux[begin] Prefix Cop To Dot Conj       (7)
    #   Message (plain):      Dot Aux[begin] To Dot Conj                  (5)
    #   Signature (protocol): Dot Aux[begin] Prefix Modal[sig] Dot Conj   (6)
    #   Signature (plain):    Dot Aux[begin] Modal[sig] Dot Conj          (5)

    sig:
      # Plain signature armor — no protocol tag.
      # Output: ----- BEGIN SIGNATURE -----\n<payload>\n----- END SIGNATURE -----
      payload_wordlist: "base58"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Modal[sig] Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Modal[sig] Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    sig_pgp:
      # PGP signature armor.
      # Output: ----- BEGIN PGP SIGNATURE -----\n<payload>\n----- END PGP SIGNATURE -----
      payload_wordlist: "base58"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[pgp] Modal[sig] Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[pgp] Modal[sig] Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    sig_nostr:
      # Nostr signature armor (Schnorr/secp256k1).
      # Output: ----- BEGIN NOSTR SIGNATURE -----\n<payload>\n----- END NOSTR SIGNATURE -----
      # Nostr Schnorr sigs are 64 bytes (128 hex chars) — shorter than PGP.
      payload_wordlist: "base16"
      cover_wordlist: "default"
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nostr] Modal[sig] Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nostr] Modal[sig] Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    sig_bip39:
      # Nostr signature armor with BIP39 mnemonic words as payload.
      # Output: ----- BEGIN NOSTR SIGNATURE -----\n<bip39 words>\n----- END NOSTR SIGNATURE -----
      # Schnorr sig = 64 bytes = 512 bits → 47 BIP39 words (11 bits/word).
      payload_wordlist: "bip39"
      payload_language: "english"
      payload_separator: " "
      rules:
        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nostr] Modal[sig] Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"
        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nostr] Modal[sig] Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    seal_nostr:
      # Nostr seal armor (bech32 npub).
      # Output: ----- BEGIN NOSTR SEAL -----\nnpub1<bech32 payload>\n----- END NOSTR SEAL -----
      # The npub1 prefix is a cover word (Prefix[npub]); payload is the
      # bech32 data after the prefix.  Decoded output = bech32 data only;
      # the caller restores the npub1 prefix (same as crypto/nostr).
      payload_wordlist: "bech32"
      cover_wordlist: "default"
      payload_line_width: null
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "HEADER SEAL_PREFIX BODY FOOTER"
              weight: 1.0
              lambda: "λn:(e->t). n"

        HEADER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot Aux[begin] Prefix[nostr] Modal[seal] Dot Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        SEAL_PREFIX:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Prefix[npub]"
              weight: 1.0
              lambda: "λn:(e->t). n"

        FOOTER:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot Aux[end] Prefix[nostr] Modal[seal] Dot"
              weight: 1.0
              lambda: "λn:(e->t). n"

    # ── Email dialects ────────────────────────────────────────────
    #
    # Email message structure — models RFC 5322 / MIME anatomy.
    # Cover words from cover_email.yaml provide header labels, MIME
    # types, boundaries, and placeholder values.
    # Payload uses base64 alphabet (same as standard CS).
    #
    # Output structures:
    #   email      → simple text/plain with envelope headers
    #   email_alt  → multipart/alternative (text + html)
    #   email_mime → multipart/mixed with attachment
    #   email_raw  → content only, no email structure

    email:
      # Simple text/plain email with envelope headers.
      # Output:
      #   From: <sender@glossia.local>
      #   To: <recipient@glossia.local>
      #   Date: Thu, 01 Jan 2026 00:00:00 +0000
      #   Subject: <content>
      #   Content-Type: text/plain; charset="UTF-8"
      #
      #   <content>
      payload_wordlist: "base64"
      cover_wordlist: "email"
      payload_line_width: null
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "ENVELOPE_HEADERS SUBJECT_LINE PLAIN_PREAMBLE BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"

        # ── Email structure rules ─────────────────────────────────
        # These are inherited by email_alt, email_mime, email_raw
        # via parent: email. All use structural passthrough lambda.

        SUBJECT_BODY:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "N"
              weight: 0.15
              lambda: "λn:(e->t). n"
            - production: "N SUBJECT_BODY"
              weight: 0.85
              lambda: "λn:(e->t). n"

        ENVELOPE_HEADERS:
          lambda: "λn:(e->t). n"
          cfg_productions:
            # Minimal: stable sender-set headers only
            - production: "Aux[from] To[from-val] Conj Aux[to] To[to-val] Conj Aux[date] To[date-val] Conj"
              weight: 0.7
              lambda: "λn:(e->t). n"
            # With transport trace (what a received email looks like)
            - production: "Aux[return-path] To[addr-val] Conj Aux[received] To[trace-val] Conj Aux[date] To[date-val] Conj Aux[from] To[from-val] Conj Aux[to] To[to-val] Conj Aux[message-id] To[msgid-val] Conj"
              weight: 0.3
              lambda: "λn:(e->t). n"

        SUBJECT_LINE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Aux[subject] SUBJECT_BODY Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        PLAIN_PREAMBLE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Prefix[text-plain] Conj Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_PREAMBLE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Modal[mime-version] Conj Prefix[multipart-mixed] Conj Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_ALT_PREAMBLE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Modal[mime-version] Conj Prefix[multipart-alt] Conj Conj"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_TEXT_PART:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot[boundary] Conj Prefix[text-plain] Conj Conj BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_HTML_PART:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot[boundary] Conj Prefix[text-html] Conj Conj Cop[html-body]"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_ATTACH:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot[boundary] Conj Prefix[app-octet] Conj Cop[cte-base64] Conj Modal[disp-attach] Conj Conj BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_CLOSE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot[boundary-end]"
              weight: 1.0
              lambda: "λn:(e->t). n"

    email_alt:
      # Multipart/alternative (text + html).
      # Models the common Gmail-style message with text/plain and
      # text/html alternatives. HTML part is cover (structural duplicate).
      # Output:
      #   <envelope headers>
      #   Subject: <content>
      #   MIME-Version: 1.0
      #   Content-Type: multipart/alternative; boundary="glossia-alt"
      #
      #   --glossia-alt
      #   Content-Type: text/plain; charset="UTF-8"
      #
      #   <content>
      #
      #   --glossia-alt
      #   Content-Type: text/html; charset="UTF-8"
      #
      #   <html><body></body></html>
      #
      #   --glossia-alt--
      parent: email
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "ENVELOPE_HEADERS SUBJECT_LINE MIME_ALT_PREAMBLE MIME_TEXT_PART MIME_HTML_PART MIME_CLOSE"
              weight: 1.0
              lambda: "λn:(e->t). n"

        # email_alt uses --glossia-alt boundaries
        MIME_TEXT_PART:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot[boundary-alt] Conj Prefix[text-plain] Conj Conj BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_HTML_PART:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Dot[boundary-alt] Conj Prefix[text-html] Conj Conj Cop[html-body]"
              weight: 1.0
              lambda: "λn:(e->t). n"

        MIME_CLOSE:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Conj Dot[boundary-alt-end]"
              weight: 1.0
              lambda: "λn:(e->t). n"

    email_mime:
      # Multipart/mixed with attachment.
      # Text/plain part carries body payload, attachment part carries overflow.
      # Output:
      #   <envelope headers>
      #   Subject: <content>
      #   MIME-Version: 1.0
      #   Content-Type: multipart/mixed; boundary="glossia"
      #
      #   --glossia
      #   Content-Type: text/plain; charset="UTF-8"
      #
      #   <content>
      #
      #   --glossia
      #   Content-Type: application/octet-stream
      #   Content-Transfer-Encoding: base64
      #   Content-Disposition: attachment
      #
      #   <content>
      #
      #   --glossia--
      parent: email
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "ENVELOPE_HEADERS SUBJECT_LINE MIME_PREAMBLE MIME_TEXT_PART MIME_ATTACH MIME_CLOSE"
              weight: 1.0
              lambda: "λn:(e->t). n"

    email_raw:
      # Content only — no email structure, no line wrapping.
      # Used for testing or when only the encoded body is needed.
      parent: email
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "BODY"
              weight: 1.0
              lambda: "λn:(e->t). n"
