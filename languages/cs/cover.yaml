# ASCII Armor Cover Words for CS Payloads
#
# These are the structural framing tokens for armored messages.
# All use function-word POS tags (Dot, Aux, Cop, To, Prefix, Modal, Conj)
# so they are excluded from payload embedding.
#
# Refinement tags allow the grammar to deterministically place
# the correct token (e.g. Aux[begin] always selects "BEGIN").
#
# Output formats:
#   Encrypted:  ----- BEGIN PGP ENCRYPTED MESSAGE -----\n<payload>\n----- END PGP ENCRYPTED MESSAGE -----
#   Plain:      ----- BEGIN MESSAGE -----\n<payload>\n----- END MESSAGE -----
#   Signature:  ----- BEGIN NOSTR SIGNATURE -----\n<payload>\n----- END NOSTR SIGNATURE -----
#   Seal:       ----- BEGIN NOSTR SEAL -----\n<payload>\n----- END NOSTR SEAL -----

"-----":
  Dot: 1.0

BEGIN:
  Aux: 1.0
  refinement: begin

END:
  Aux: 1.0
  refinement: end

ENCRYPTED:
  Cop: 1.0

MESSAGE:
  To: 1.0

"\n":
  Conj: 1.0

NIP-04:
  Prefix: 1.0
  refinement: nip04

NIP-44:
  Prefix: 1.0
  refinement: nip44

NOSTR:
  Prefix: 1.0
  refinement: nostr

SIGNATURE:
  Modal: 1.0
  refinement: sig

SEAL:
  Modal: 1.0
  refinement: seal

"npub1":
  Prefix: 1.0
  refinement: npub

PGP:
  Prefix: 1.0
  refinement: pgp
