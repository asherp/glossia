# Czech cover words for Glossia
# These words fill non-payload grammar slots and MUST NOT appear in
# languages/czech/payload.yaml (disjointness is enforced at compile time).
#
# Czech has no articles, so there is no Det category (cf. Latin).
# Adjectives (-ý/-á/-é/-í) and manner adverbs (-ě) are guaranteed disjoint
# from the BIP39 payload, which contains no diacritic-vowel-final words.
#
# Order: function words first, then content cover words.
#
