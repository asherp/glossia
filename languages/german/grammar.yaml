# German Grammar Rules — Montague Grammar with CCG Combinators
#
# German main clauses are verb-second (V2) and broadly SVO in the simple
# declarative sentences this grammar generates ("Der Hund sieht die Katze"),
# so the linearizations mirror the English body grammar. The Montague type
# system is language-agnostic; only the surface words (payload.yaml /
# cover.yaml) and production weights are German-specific.
#
# Type inventory:
#   e     = entity
#   t     = truth value (sentence/proposition)
#   A → B = function from A to B
#
# codec: base_n weaves the payload words into the prose verbatim (rebase, no
# padding word), so a German BIP39 mnemonic round-trips word-for-word.

grammar:
  name: "German Grammar"
  codec: base_n
  default_wordlist: default

  # Apply the German morphological agreement post-pass: determiner gender/case
  # agreement (der/die/das/den/dem, ein/eine/einen/einem/einer) and noun
  # capitalization. See src/generator/agreement.rs. Adjectives are kept in
  # predicative position (uninflected) below, so attributive declension is not
  # yet required.
  morphology: german

  # Cap sequence enumeration. The recursive VP_PP_TAIL / conjoined-clause
  # productions make exhaustive enumeration explode past k≈14 (as noted in the
  # meta grammar). k=12 keeps first-run enumeration well under a second while
  # still allowing 12-token sentences.
  max_k: 12

  types:
    - name: "N"
      lambda_type: "e -> t"
    - name: "V"
      lambda_type: "e -> (e -> t)"
    - name: "Adj"
      lambda_type: "e -> e"
    - name: "Adv"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "Det"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "Prep"
      lambda_type: "e -> (e -> t)"
    - name: "Conj"
      lambda_type: "t -> (t -> t)"
    - name: "Cop"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "Modal"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "Aux"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "To"
      lambda_type: "(e -> t) -> (e -> t)"
    - name: "Dot"
      lambda_type: "t"
    - name: "Prefix"
      lambda_type: "t -> t"
    - name: "Pron"
      lambda_type: "e"

  # Base rules = the "body" dialect (Glossia's default).
  rules:
    sentence:
      lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
      cfg_productions:
        - production: "NP VP Dot"
          weight: 0.45
          lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
        - production: "NP VP PP Dot"
          weight: 0.20
          lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
        - production: "NP Adv V NP Dot"
          weight: 0.10
          lambda: "λnp:(e->t). λadv:((e->t)->(e->t)). λv:(e->(e->t)). adv(v(np))"
        - production: "NP V NP Dot"
          weight: 0.10
          lambda: "λnp:(e->t). λv:(e->(e->t)). v(np)"
        - production: "NP VP Conj NP VP Dot"
          weight: 0.10
          lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
        - production: "NP VP PP PP Dot"
          weight: 0.05
          lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"

    noun_phrase:
      # No attributive "Det Adj N" — German attributive adjectives must decline
      # (strong/weak/mixed), which the Phase-1 agreement pass does not yet do.
      # Adjectives appear predicatively (Cop Adj), where they are uninflected.
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "N"
          weight: 1.0
          lambda: "λn:(e->t). n"
        - production: "Det[def] N"
          weight: 0.55
          lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"
        - production: "Det[indef] N"
          weight: 0.30
          lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"
        - production: "Det[quant] N"
          weight: 0.15
          lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"

    verb_phrase:
      lambda: "λv:(e->(e->t)). v"
      cfg_productions:
        - production: "VP_BASE"
          weight: 0.70
          lambda: "λv:(e->(e->t)). v"
        - production: "VP_BASE VP_PP_TAIL"
          weight: 0.30
          lambda: "λv:(e->(e->t)). v"

    vp_base:
      lambda: "λv:(e->(e->t)). v"
      cfg_productions:
        - production: "V NP"
          weight: 0.28
          lambda: "λnp:(e->t). λv:(e->(e->t)). v(np)"
        - production: "Modal V NP"
          weight: 0.22
          lambda: "λnp:(e->t). λv:(e->(e->t)). λmod:((e->t)->(e->t)). mod(v(np))"
        - production: "Cop[sg] Adj"
          weight: 0.28
          lambda: "λadj:(e->e). λcop:((e->t)->(e->t)). cop(adj)"
        - production: "Cop[pl] Adj"
          weight: 0.10
          lambda: "λadj:(e->e). λcop:((e->t)->(e->t)). cop(adj)"
        - production: "Modal V"
          weight: 0.07
          lambda: "λv:(e->(e->t)). λmod:((e->t)->(e->t)). mod(v)"
        - production: "V To V"
          weight: 0.05
          lambda: "λv2:(e->(e->t)). λto:((e->t)->(e->t)). λv1:(e->(e->t)). v1(to(v2))"

    vp_with_pp:
      lambda: "λprep:(e->(e->t)). prep"
      cfg_productions:
        - production: "PP"
          weight: 0.70
          lambda: "λprep:(e->(e->t)). prep"
        - production: "PP VP_PP_TAIL"
          weight: 0.30
          lambda: "λprep:(e->(e->t)). prep"

    prepositional_phrase:
      lambda: "λprep:(e->(e->t)). prep"
      cfg_productions:
        - production: "Prep NP"
          weight: 1.0
          lambda: "λnp:(e->t). λprep:(e->(e->t)). prep(np)"

  dialects:
    # Word-preserving seed dialect for the web BIP39 panel. Inherits the base
    # (body) rules and morphology; base_n weaves the seed words in verbatim.
    bip39:
      codec: base_n
      payload_wordlist: "default"
      cover_wordlist: "default"

    # Longer, flowing sentences for paragraph text.
    prose:
      payload_wordlist: "default"
      cover_wordlist: "default"
      rules:
        sentence:
          lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
          cfg_productions:
            - production: "NP VP Dot"
              weight: 0.20
              lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
            - production: "NP VP PP Dot"
              weight: 0.25
              lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
            - production: "NP VP PP PP Dot"
              weight: 0.20
              lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
            - production: "NP Adv V NP PP Dot"
              weight: 0.10
              lambda: "λnp:(e->t). λadv:((e->t)->(e->t)). λv:(e->(e->t)). adv(v(np))"
            - production: "NP VP Conj NP VP Dot"
              weight: 0.15
              lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"
            - production: "NP VP PP PP PP Dot"
              weight: 0.10
              lambda: "λnp:(e->t). λvp:((e->t)->t). vp(np)"

        noun_phrase:
          # Attributive "Det Adj N" omitted (see body noun_phrase note).
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "Det[def] N"
              weight: 0.45
              lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"
            - production: "Det[indef] N"
              weight: 0.30
              lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"
            - production: "Det[quant] N"
              weight: 0.15
              lambda: "λn:(e->t). λdet:((e->t)->(e->t)). det(n)"
            - production: "N"
              weight: 0.05
              lambda: "λn:(e->t). n"
            - production: "Pron"
              weight: 0.05
              lambda: "λpron:e. pron"

        verb_phrase:
          lambda: "λv:(e->(e->t)). v"
          cfg_productions:
            - production: "V NP"
              weight: 0.25
              lambda: "λnp:(e->t). λv:(e->(e->t)). v(np)"
            - production: "Modal V NP"
              weight: 0.20
              lambda: "λnp:(e->t). λv:(e->(e->t)). λmod:((e->t)->(e->t)). mod(v(np))"
            - production: "V NP PP"
              weight: 0.15
              lambda: "λnp:(e->t). λv:(e->(e->t)). v(np)"
            - production: "Cop[sg] Adj"
              weight: 0.12
              lambda: "λadj:(e->e). λcop:((e->t)->(e->t)). cop(adj)"
            - production: "Cop[pl] Adj"
              weight: 0.03
              lambda: "λadj:(e->e). λcop:((e->t)->(e->t)). cop(adj)"
            - production: "Adv V NP"
              weight: 0.10
              lambda: "λnp:(e->t). λv:(e->(e->t)). λadv:((e->t)->(e->t)). adv(v(np))"
            - production: "V NP Conj V NP"
              weight: 0.10
              lambda: "λnp:(e->t). λv:(e->(e->t)). v(np)"
            - production: "Modal V"
              weight: 0.05
              lambda: "λv:(e->(e->t)). λmod:((e->t)->(e->t)). mod(v)"

        prepositional_phrase:
          lambda: "λprep:(e->(e->t)). prep"
          cfg_productions:
            - production: "Prep NP"
              weight: 0.60
              lambda: "λnp:(e->t). λprep:(e->(e->t)). prep(np)"
            - production: "Prep Det[def] N"
              weight: 0.25
              lambda: "λn:(e->t). λdet:((e->t)->(e->t)). λprep:(e->(e->t)). prep(det(n))"
            - production: "Prep Det[indef] N"
              weight: 0.15
              lambda: "λn:(e->t). λdet:((e->t)->(e->t)). λprep:(e->(e->t)). prep(det(n))"

    # Bare payload words separated by sentence stops — maximum density,
    # minimum cover. Useful for compact mnemonic display.
    payload_only:
      payload_wordlist: "default"
      cover_wordlist: "default"
      rules:
        sentence:
          lambda: "λn:(e->t). n"
          cfg_productions:
            - production: "N Dot"
              weight: 0.30
              lambda: "λn:(e->t). n"
            - production: "N N Dot"
              weight: 0.25
              lambda: "λn:(e->t). n"
            - production: "N N N Dot"
              weight: 0.20
              lambda: "λn:(e->t). n"
            - production: "N N N N Dot"
              weight: 0.15
              lambda: "λn:(e->t). n"
            - production: "N N N N N Dot"
              weight: 0.10
              lambda: "λn:(e->t). n"
