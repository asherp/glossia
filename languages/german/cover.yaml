# German Cover Wordlist — grammatical skeleton for German prose
#
# Cover words fill the function-word slots (Det, Prep, Conj, Cop, Modal, Aux,
# To, Dot) and the non-payload-bearing content slots (V, Adj, Adv, N) that give
# the generated sentences their shape. Payload words (the 2048 dys2p de-2048
# entries in payload.yaml) are woven into the remaining N/V/Adj/Adv slots.
#
# INVARIANT: this set is disjoint from payload.yaml. Verified by
# glossia-tools/py/generate_german_payload.py's companion check.

