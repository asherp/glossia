# Palette control points for parametric curve encoding
#
# CIELAB control points sampled from official colormap LUTs.
# The curve is built by cubic spline interpolation through these points,
# then arc-length reparameterized for uniform perceptual spacing.
#
# Auto-generated by: python generate_payload.py --bootstrap
#
# Sources:
#   viridis, plasma, inferno, magma:
#     BIDS/colormap (CC0) — github.com/BIDS/colormap
#     van der Walt, Smith & Firing, SciPy 2015
#   cividis:
#     Nunez, Anderton & Renslow, PLoS ONE 13(7) 2018
#   turbo:
#     Mikhailov, Google 2019 (Apache-2.0)
#   mako, rocket:
#     seaborn (BSD-3) — github.com/mwaskom/seaborn

