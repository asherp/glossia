# Korean BIP39 Payload Wordlist for Glossia
# Source: official BIP-0039 Korean wordlist (2048 words)
#   https://github.com/bitcoin/bips/blob/master/bip-0039/korean.txt
#
# The published list is NFD (decomposed jamo); these keys are its NFC
# (precomposed syllable) forms, in the same order. Decoding composes
# Hangul before lookup, so NFD input matches too.
#
# POS tags: nouns are N; -히 words and a hand-picked set are Adv;
# Sino-Korean -적 forms are Adj (with an N fallback). POS only guides
# cover-text generation; decoding is wordlist membership.
#
# Order is the canonical BIP39 order: APPEND-ONLY and frozen.
# Generated by languages/korean/generate.py.
#
