# Korean cover words for Glossia
# These fill non-payload grammar slots and MUST NOT appear in
# languages/korean/payload.yaml (disjointness is enforced at compile time).
#
# Korean has no articles, so there is no Det category. Case and topic
# particles are Prep words with a refinement naming their function
# (subj, top, obj, loc, com, gen, dir). The agreement pass
# (morphology: korean) picks the allomorph that fits the preceding
# syllable and attaches the particle to it, so 사과 + 을 is written 사과를.
#
# Verbs are cover-only (the BIP39 list holds none) and carry a
# refinement: tr (takes an object) or intr.
# Generated by languages/korean/generate.py.
#
