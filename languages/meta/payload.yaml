# Meta-Language Payload Wordlist — Dialect Identifiers
#
# Each word names a dialect or data format. These are the entities
# that the dialect calculus composes into pipelines.
#
# At the meta-grammar level:
#   N    = the dialect as an encoder ("latin encodes...")
#   Adj  = the dialect as a format modifier ("latin prose", "hex data")
#   Pron = the dialect as a data reference (standalone)
#
# Statistics:
#   Total words: 17 (bitpacking: false — no power-of-two constraint)
#
# The 17 identifiers cover:
#   Natural languages:  latin, english
#   Output styles:      prose, body, subject, spells
#   Data formats:       hex, base64, base58, ascii7, bits, bytes
#   Rendering:          html
#   Protocols:          nostr, pgp
#   Formal systems:     primes, merkle
#
latin:
  N: 0.5
  Adj: 0.4
  Pron: 0.1

