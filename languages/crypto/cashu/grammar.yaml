# Cashu Token Grammar — Character-Level Encoding
#
# Base64url dialects for Cashu version A and B tokens.

grammar:
  name: "Cashu Token Grammar"
  codec: base_n
  payload_separator: ""
  dot_is_punctuation: false
  payload_line_width: null

  types:
    - name: "N"
      lambda_type: "e -> t"
    - name: "Prefix"
      lambda_type: "t -> t"

  rules:
    sentence:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "BODY"
          weight: 1.0
          lambda: "λn:(e->t). n"
    BODY:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "N"
          weight: 0.1
          lambda: "λn:(e->t). n"
        - production: "N BODY"
          weight: 0.9
          lambda: "λn:(e->t). n"

  dialects:
    a:
      payload_wordlist: "base64url"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[a] BODY"
    b:
      payload_wordlist: "base64url"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[b] BODY"
