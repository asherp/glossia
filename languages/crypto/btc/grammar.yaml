# Bitcoin Address Grammar — Character-Level Encoding
#
# BIP-named dialects with payload_language: "cs" to resolve
# bech32/base58 wordlists from the cs/ canonical location.
#
# Bech32 dialects: bip173 (SegWit v0), bip350 (Taproot)
# Legacy dialects: p2pkh (base58)

grammar:
  name: "Bitcoin Address Grammar"
  bitpacking: false
  payload_separator: ""
  dot_is_punctuation: false
  payload_line_width: null

  types:
    - name: "N"
      lambda_type: "e -> t"
    - name: "Prefix"
      lambda_type: "t -> t"

  rules:
    sentence:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "BODY"
          weight: 1.0
          lambda: "λn:(e->t). n"
    BODY:
      lambda: "λn:(e->t). n"
      cfg_productions:
        - production: "N"
          weight: 0.1
          lambda: "λn:(e->t). n"
        - production: "N BODY"
          weight: 0.9
          lambda: "λn:(e->t). n"

  dialects:
    bip173:
      payload_wordlist: "bech32"
      payload_language: "cs"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[bip173] BODY"
    bip173-test:
      payload_wordlist: "bech32"
      payload_language: "cs"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[bip173-test] BODY"
    bip350:
      payload_wordlist: "bech32"
      payload_language: "cs"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[bip350] BODY"
    bip350-test:
      payload_wordlist: "bech32"
      payload_language: "cs"
      rules:
        sentence:
          cfg_productions:
            - production: "Prefix[bip350-test] BODY"
    p2pkh:
      payload_wordlist: "base58"
      payload_language: "cs"
    p2pkh-test:
      payload_wordlist: "base58"
      payload_language: "cs"
