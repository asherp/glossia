[workspace]
members = ["glossia-cli", "glossia-tools"]
# Only the glossia library is a default member. This keeps the WASM build
# (wasm-pack runs `cargo build` with no package selector) scoped to glossia
# alone — otherwise resolver v2 unifies glossia-cli/glossia-tools' `native`
# feature onto the wasm build, pulling in nlprule (and its C lib onig_sys,
# which cannot compile to wasm32). Build everything with `cargo build --workspace`.
default-members = ["."]
resolver = "2"

[package]
name = "glossia"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Encode binary data (BIP39 mnemonics, keys, arbitrary payloads) into grammatically correct, human-readable natural language"
repository = "https://github.com/asherp/glossia"
homepage = "https://github.com/asherp/glossia"
documentation = "https://docs.rs/glossia"
readme = "README.md"
keywords = ["encoding", "bip39", "grammar", "codec", "linguistics"]
categories = ["encoding", "text-processing"]
build = "build.rs"
# Whitelist exactly what the crate needs at build/runtime. build.rs only ever
# reads languages/**/*.yaml (via include_str! and its filesystem scan); the
# .cfg/.txt/.png/.py files under languages/ are source/derivation artifacts that
# are never compiled in. Whitelisting also keeps repo cruft (.env, .cache-glossia/,
# docs/, root data dumps, CI config) out of the published .crate.
include = [
    "src/**/*",
    "/build.rs",
    "languages/**/*.yaml",
    "examples/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["native"]
# The library itself only needs nlprule (grammar checking) and image (image_codec).
# CLI-only deps (clap, csv, reqwest, rayon, flate2) live in the glossia-cli /
# glossia-tools workspace members instead.
native = ["dep:nlprule", "dep:image"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]

# Size-oriented release profile (issue #21). `lto` and `codegen-units = 1` let
# the linker discard unused code across crate boundaries, and `strip` removes
# symbol/debug info — all of which shrink both the native binary and the wasm
# bundle without hurting runtime speed. Aggressive size-only optimisation of the
# wasm artifact itself (e.g. `wasm-opt -Oz`) is handled in `build_web.sh`, so
# `opt-level` is left at its default to keep native CLI throughput fast.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Aggressive size optimisation of the wasm bundle (issue #21). wasm-pack runs
# its own bundled wasm-opt; configuring its flags here makes the size pass
# explicit and always-applied. `-Oz` optimises for size and the strip flags
# drop the debug/name and producers sections.
#
# The `--enable-*` flags are required because modern stable rustc emits these
# wasm features by default for wasm32-unknown-unknown, but wasm-opt rejects
# them unless explicitly enabled ("Bulk memory operations require bulk memory
# [--enable-bulk-memory]"). We enable the full default rustc featureset so the
# validator accepts the input; enabling a superset is harmless. We also do NOT
# install a separate system `wasm-opt` in CI — an older one gets picked up by
# wasm-pack and fails the same validation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-Oz',
    '--strip-debug',
    '--strip-producers',
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    '--enable-sign-ext',
    '--enable-mutable-globals',
    '--enable-multivalue',
    '--enable-reference-types',
]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1.0"
regex = "1.10"
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
moniker = "0.5"  # For lambda calculus variable binding
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
reed-solomon = "0.2"

# Native-only deps (WASM-incompatible) used by the library itself
nlprule = { version = "0.6", optional = true }
image = { version = "0.25", optional = true }

# WASM deps
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[build-dependencies]
serde_yaml = "0.9"
