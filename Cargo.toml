[package]
name = "glossia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
default = ["native"]
native = ["dep:nlprule", "dep:reqwest", "dep:rayon", "dep:csv", "dep:clap", "dep:flate2", "dep:image"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]

[[bin]]
name = "glossia"
path = "src/bin/glossia.rs"
required-features = ["native"]

[[bin]]
name = "cleanup_weights"
path = "src/bin/cleanup_weights.rs"
required-features = ["native"]

[[bin]]
name = "tag_words"
path = "src/bin/tag_words.rs"
required-features = ["native"]

[[bin]]
name = "compare_pos_weights"
path = "src/bin/compare_pos_weights.rs"
required-features = ["native"]

[[bin]]
name = "get_top_words"
path = "src/bin/get_top_words.rs"
required-features = ["native"]

[[bin]]
name = "validate_pos_weights"
path = "src/bin/validate_pos_weights.rs"
required-features = ["native"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
anyhow = "1.0"
regex = "1.10"
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
moniker = "0.5"  # For lambda calculus variable binding
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"

# Native-only deps (WASM-incompatible)
nlprule = { version = "0.6", optional = true }
reqwest = { version = "0.11", features = ["blocking"], optional = true }
rayon = { version = "1.11", optional = true }
csv = { version = "1.3", optional = true }
clap = { version = "4.4", features = ["derive"], optional = true }
flate2 = { version = "1.0", optional = true }
image = { version = "0.25", optional = true }

# WASM deps
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[build-dependencies]
serde_yaml = "0.9"
