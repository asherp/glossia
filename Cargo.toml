[workspace]
members = ["glossia-cli", "glossia-tools"]
# Only the glossia library is a default member. This keeps the WASM build
# (wasm-pack runs `cargo build` with no package selector) scoped to glossia
# alone — otherwise resolver v2 unifies glossia-cli/glossia-tools' `native`
# feature onto the wasm build, pulling in nlprule (and its C lib onig_sys,
# which cannot compile to wasm32). Build everything with `cargo build --workspace`.
default-members = ["."]
resolver = "2"

[package]
name = "glossia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
default = ["native"]
# The library itself only needs nlprule (grammar checking) and image (image_codec).
# CLI-only deps (clap, csv, reqwest, rayon, flate2) live in the glossia-cli /
# glossia-tools workspace members instead.
native = ["dep:nlprule", "dep:image"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
anyhow = "1.0"
regex = "1.10"
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
moniker = "0.5"  # For lambda calculus variable binding
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
reed-solomon = "0.2"

# Native-only deps (WASM-incompatible) used by the library itself
nlprule = { version = "0.6", optional = true }
image = { version = "0.25", optional = true }

# WASM deps
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[build-dependencies]
serde_yaml = "0.9"
