name: PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

# contents: write to push the preview into gh-pages; pull-requests: write so the
# action can post/update the preview-link comment on the PR.
permissions:
  contents: write
  pull-requests: write

# Share one repo-wide group with the Deploy Web App workflow so no two gh-pages
# pushes overlap. GitHub Pages serves one deployment at a time; overlapping
# pushes make the loser fail with "Deployment failed, try again later", leaving
# the just-deployed preview at pr-preview/pr-<N>/ returning 404. cancel-in-progress
# is false so an in-flight deploy always finishes publishing before the next runs.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip pull requests from forks: their restricted GITHUB_TOKEN cannot push to
    # gh-pages, so a preview deploy would always fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # The build steps are skipped when a PR is closed: pr-preview-action only
      # needs to tear down the existing preview directory in that case.
      - name: Install Rust
        if: github.event.action != 'closed'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: github.event.action != 'closed'
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        if: github.event.action != 'closed'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # NOTE: do not install a system `wasm-opt` here. wasm-pack uses its own
      # bundled wasm-opt and runs the size pass configured under
      # [package.metadata.wasm-pack.profile.release] in Cargo.toml; a system
      # binary gets picked up instead and can reject modern wasm features.
      - name: Build WASM
        if: github.event.action != 'closed'
        run: ./build_web.sh

      - name: Install mdBook
        if: github.event.action != 'closed'
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pin the version so CI matches local builds; `latest` drifted to
          # mdBook 0.5.x, which rejects legacy book.toml fields.
          mdbook-version: '0.4.40'

      # Build the docs book into web/docs/ so it deploys alongside the web app.
      # -d is resolved relative to the book root (docs/), so ../web/docs lands the
      # rendered site at web/docs/, reachable at .../pr-preview/pr-<N>/docs/.
      - name: Build docs
        if: github.event.action != 'closed'
        run: mdbook build docs -d ../web/docs

      # Stamp the deployed pages with the commit they were built from. A cached
      # page that looks current is indistinguishable from a current one, so the
      # footer says which build is on screen instead of leaving it to be guessed.
      - name: Stamp build
        if: github.event.action != 'closed'
        run: |
          SHA='${{ github.event.pull_request.head.sha }}'
          sed -i "s|<meta name=\"glossia-build\" content=\"dev\">|<meta name=\"glossia-build\" content=\"${SHA:0:7}\">|" web/index.html
          grep -o 'glossia-build" content="[^"]*"' web/index.html

      # On open/synchronize/reopen: deploy web/ to gh-pages under
      # pr-preview/pr-<N>/ and comment the URL. On close: remove that directory.
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./web/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
