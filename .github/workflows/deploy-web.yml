name: Deploy Web App

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'build_web.sh'
      - 'languages/**'
  workflow_dispatch:

# Pushing the built site to the gh-pages branch requires write access.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Provides the `wasm-opt` CLI used by build_web.sh for the -Oz size pass.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build WASM
        run: ./build_web.sh

      # Deploy the production site to the root of gh-pages. clean-exclude keeps
      # the pr-preview/ directory (managed by the PR Preview workflow) intact so
      # production deploys don't wipe live preview deployments.
      - name: Deploy to GitHub Pages (production)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web
          clean: true
          clean-exclude: |
            pr-preview/
