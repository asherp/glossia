name: Deploy Web App

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'build_web.sh'
      - 'languages/**'
      - 'docs/**'
  workflow_dispatch:

# Pushing the built site to the gh-pages branch requires write access.
permissions:
  contents: write

# Serialize every workflow that pushes to gh-pages under one repo-wide group.
# Each push to gh-pages triggers GitHub's own pages-build-deployment, and Pages
# only runs one deployment at a time — two overlapping pushes make the loser
# fail with "Deployment failed, try again later", which is what leaves a freshly
# deployed path (e.g. a PR preview) returning 404. The PR Preview workflow shares
# this exact group name so production and preview deploys can never race.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # NOTE: do not install a system `wasm-opt` here. wasm-pack uses its own
      # bundled wasm-opt and runs the size pass configured under
      # [package.metadata.wasm-pack.profile.release] in Cargo.toml; a system
      # binary gets picked up instead and can reject modern wasm features.
      - name: Build WASM
        run: ./build_web.sh

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pin the version so CI matches local builds; `latest` drifted to
          # mdBook 0.5.x, which rejects legacy book.toml fields.
          mdbook-version: '0.4.40'

      # Build the docs book into web/docs/ so it deploys alongside the web app.
      # -d is resolved relative to the book root (docs/), so ../web/docs lands the
      # rendered site at web/docs/, served in production at glossia.io/docs/.
      - name: Build docs
        run: mdbook build docs -d ../web/docs

      # Deploy the production site to the root of gh-pages. clean-exclude keeps
      # the pr-preview/ directory (managed by the PR Preview workflow) intact so
      # production deploys don't wipe live preview deployments.
      - name: Deploy to GitHub Pages (production)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web
          clean: true
          clean-exclude: |
            pr-preview/
