name: Publish to crates.io

# Publishes the glossia crates when you push a version tag, e.g.
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# The same push also creates the GitHub Release page for the tag, once both
# crates are on crates.io, and attaches prebuilt `glossia` binaries to it --
# see the last step of `publish` and the `binaries` job.
#
# The tag IS the version-bump signal: bump `version` in the root Cargo.toml
# (and glossia-cli/Cargo.toml) first, commit, then tag with the matching
# `vX.Y.Z`. crates.io permanently rejects re-publishing an existing version, so
# publishing is deliberately tied to tags rather than every merge to master.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Authentication uses a crates.io API token stored as the CARGO_REGISTRY_TOKEN
# GitHub Actions secret:
# 1. On crates.io: Account Settings → API Tokens → New Token, with the
#    publish-update scope (and publish-new if the crate doesn't exist yet),
#    ideally scoped to the `glossia` and `glossia-cli` crates.
# 2. On GitHub: repo Settings → Secrets and variables → Actions →
#    New repository secret, named CARGO_REGISTRY_TOKEN.
#
# ── Prefer Trusted Publishing (OIDC, no stored token)? ────────────────────────
# On crates.io, for BOTH `glossia` and `glossia-cli`, add a trusted publisher
# (Settings → Trusted Publishing) for asherp/glossia + publish.yml. Then add an
# `id-token: write` permission below, and replace the secret with a
# rust-lang/crates-io-auth-action@v1 step whose token output feeds
# CARGO_REGISTRY_TOKEN.

on:
  push:
    tags:
      - "v*"
  # Escape hatch for a tag that is already published: builds and attaches
  # binaries without touching crates.io, which permanently refuses a re-publish.
  # Use it to backfill a release made before this job existed, or to retry a
  # platform whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to, e.g. v0.6.0"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # A manual run attaches binaries to an existing tag; the crates for that
    # version are already on crates.io and cannot be published twice.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Fail fast if the pushed tag (vX.Y.Z) doesn't match the crate version,
      # which would otherwise cause a confusing publish under the wrong version.
      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(cargo metadata --no-deps --format-version 1 \
                 | jq -r '.packages[] | select(.name=="glossia") | .version')"
          echo "tag=$tag  Cargo.toml=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match glossia version $pkg in Cargo.toml"
            exit 1
          fi

      # Publishing is irreversible -- crates.io permanently refuses to re-publish
      # a version -- so the suite runs here rather than trusting master's last CI
      # run. The two are not equivalent: dependencies resolve at job time, and a
      # semver-compatible bump between the merge and the tag would not have been
      # tested by anything. That matters more here than in most crates, because
      # verification-by-re-render makes generator behaviour part of the format:
      # drift moves every rendering while the version byte still claims
      # compatibility, and the goldens are what catch it.
      - name: Test
        run: cargo test --workspace

      # The wasm module ships in the published crate but is behind a feature
      # `--workspace` does not enable, so its exports would otherwise reach
      # crates.io untested.
      - name: Test wasm exports
        run: cargo test --features wasm --test wasm_exports

      # The library must publish first; glossia-cli depends on it. `cargo publish`
      # waits for the new version to appear in the index before returning, so the
      # CLI publish that follows can resolve it.
      - name: Publish glossia (library)
        run: cargo publish -p glossia
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish glossia-cli
        run: cargo publish -p glossia-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # The release page comes last, after both crates are actually on
      # crates.io. That ordering is the point: a page announcing a version the
      # registry does not have is the one failure worth designing out, and a
      # failed publish now stops the job before the page can exist. The reverse
      # is harmless -- a publish that succeeded without its page is fixed by
      # `gh release create` by hand.
      #
      # Notes are generated from the pull requests merged since the previous
      # version, which is what makes the page worth having: the repo keeps no
      # CHANGELOG, so this is the changelog.
      #
      # `gh` ships on the runner, so this needs no third-party action; the
      # token is the job's own, scoped by `contents: write` above.
      - name: GitHub Release
        run: |
          # --generate-notes measures from the previous *release*, not the
          # previous tag. Nothing has been released yet, so that default would
          # reach back to the first commit and make this page a list of every
          # pull request the repo has ever merged. Naming the preceding version
          # tag fixes the first page and is what every later one wants anyway.
          #
          # The tag list comes from the API rather than the checkout, which is
          # shallow and carries no tags.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          prev="$(printf '%s\n%s\n' "$tags" "$GITHUB_REF_NAME" \
                  | sort -uV | grep -B1 -Fx "$GITHUB_REF_NAME" | head -1)"
          echo "notes start: ${prev:-<none>}"
          # prev == the tag itself means this is the earliest one, so there is
          # nothing to measure from and the default is correct.
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --notes-start-tag "$prev"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Prebuilt binaries are the only install path that does not want a Rust
  # toolchain, which matters here because Glossia's audience is people handling
  # mnemonics and addresses, not only Rust developers.
  #
  # Runs after `publish`, so nothing is attached to a release that the registry
  # does not back, and a failed leg leaves the release and the crates intact --
  # re-run the job and `--clobber` replaces whatever it uploaded before.
  # fail-fast is off so one platform's toolchain trouble does not cancel the
  # others mid-build.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: publish
    # On a tag push, only after both crates are on crates.io. On a manual run,
    # `publish` is skipped rather than successful, which `always()` lets
    # through and a bare `needs:` would not.
    if: |
      always() && (github.event_name == 'workflow_dispatch'
        || needs.publish.result == 'success')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # github.ref_name is the tag on a push and the branch on a manual run,
      # so the input decides when there is one.
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest runner image available rather than latest: a
          # glibc binary runs on that version and newer, never older.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # Static, so it runs on distros older than any runner image and on
          # musl ones. Kept beside the glibc build rather than replacing it --
          # musl's allocator is materially slower, and encoding is allocation
          # heavy.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      # The tag, not the branch: a manual run must build the code that was
      # released, not whatever master has become since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked so the binary is built against the dependency versions the
      # tests above ran on. That matters more than usual here: verification by
      # re-render makes generator behaviour part of the format, so a
      # semver-compatible bump resolved at build time could move renderings.
      #
      # build.rs embeds the language YAML by asking git what is tracked, and
      # actions/checkout leaves a real repository behind, so the languages --
      # including English's prosody.yaml, which the verse dialects need -- come
      # along without further arrangement.
      - name: Build
        run: cargo build --release --locked -p glossia-cli --target ${{ matrix.target }}

      # Every leg builds natively, so the artifact can be run where it was
      # made. This checks the one thing a cross-platform build gets wrong on
      # its own -- whether the language data actually made it into the binary
      # -- by encoding payload words and requiring them back out. Meter and
      # round-trip correctness are the test suite's job, in the publish half.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/glossia"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          "$bin" --help > /dev/null
          out="$("$bin" --dialect haiku abandon ability able)"
          echo "$out"
          # -i because a payload word opening a sentence is capitalised.
          for w in abandon ability able; do
            grep -qiw "$w" <<< "$out" || { echo "::error::$w missing from output"; exit 1; }
          done

      # The archive contains the binary under its own name, `glossia`, not
      # `glossia-cli`: the package is named for the crate, the command is not.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="glossia-${TAG}-${{ matrix.target }}"
          mkdir -p "stage/$name" dist
          cp "target/${{ matrix.target }}/release/glossia" "stage/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          # shasum on macOS, sha256sum on Linux; both write the same format.
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          (cd dist && $sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "glossia-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "stage/$name", dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/glossia.exe" "stage/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      # Everything staged for the archive lives under stage/, so dist/ holds
      # exactly the assets and the glob needs no filtering.
      - name: Attach to release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
